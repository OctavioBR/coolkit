apiVersion: v1
kind: Pod
metadata:
  name: {{ include "coolkit.fullname" . }}-test-connection
  labels:
    {{- include "coolkit.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
  - name: curl
    image: curlimages/curl:8.10.1
    command:
    - /bin/sh
    - -c
    - |
      set -eu
      echo "Checking health endpoint..."
      curl -sf "http://{{ include "coolkit.fullname" . }}:{{ .Values.ports.metrics }}{{ .Values.probes.path }}"
      echo "Checking API port is reachable..."
      curl -sf -o /dev/null "http://{{ include "coolkit.fullname" . }}:{{ .Values.ports.http }}/" \
        || echo "API root returned non-2xx (acceptable if there is no / route); port is reachable."
