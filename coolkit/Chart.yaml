apiVersion: v2
name: coolkit
description: |
  Internal high-throughput HTTP API with a distributed in-memory cache,
  KEDA metrics-api autoscaling, and Cloud SQL persistence.
type: application

# Chart version — bump on any change to the chart itself (templates/values/docs).
version: 0.1.0

# The default application version. In practice this is overridden per deploy with an
# immutable image SHA via `--set image.tag=<sha>`; there is intentionally no floating tag.
appVersion: "0.1.0"

home: https://github.com/octaviobr/coolkit
maintainers:
  - name: Fathom Backend

# NOTE: KEDA and the Prometheus Operator are cluster-level platform prerequisites, NOT Helm
# dependencies. They are installed once per cluster (see docs/OPERATIONS.md) and their CRDs
# are consumed here. The ServiceMonitor template guards on CRD presence via .Capabilities.
