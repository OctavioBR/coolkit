apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coolkit.fullname" . }}
  labels:
    {{- include "coolkit.labels" . | nindent 4 }}
data:
  # HTTP API + observability ports.
  HTTP_PORT: {{ .Values.ports.http | quote }}
  METRICS_PORT: {{ .Values.ports.metrics | quote }}
  # Inter-pod cache/gossip port and how peers are discovered.
  CACHE_PORT: {{ .Values.ports.cache | quote }}
  PEER_DISCOVERY_MODE: {{ .Values.peerDiscovery.mode | quote }}
  # Headless Service the app resolves for the current set of peer pod IPs (dns mode).
  PEER_DISCOVERY_SERVICE: {{ printf "%s.%s.svc.cluster.local" (include "coolkit.headlessName" .) .Release.Namespace | quote }}
  {{- if .Values.cloudsql.enabled }}
  # Non-secret DB connection info. Credentials come from the Secret (see deployment.yaml).
  DB_HOST: {{ .Values.cloudsql.host | quote }}
  DB_PORT: {{ .Values.cloudsql.port | quote }}
  DB_NAME: {{ .Values.cloudsql.dbname | quote }}
  {{- end }}
