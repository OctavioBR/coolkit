{{- if .Values.keda.enabled -}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "coolkit.fullname" . }}
  labels:
    {{- include "coolkit.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "coolkit.fullname" . }}
  minReplicaCount: {{ .Values.keda.minReplicas }}
  maxReplicaCount: {{ .Values.keda.maxReplicas }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  # If the scaler endpoint is unreachable, hold at a safe mid-count rather than min or max.
  fallback:
    failureThreshold: {{ .Values.keda.fallback.failureThreshold }}
    replicas: {{ .Values.keda.fallback.replicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      # Asymmetric behavior: fast scale-up, slow/capped scale-down to avoid cache rebalancing
      # storms when many members leave at once.
      behavior:
        {{- toYaml .Values.keda.behavior | nindent 8 }}
  triggers:
    - type: metrics-api
      metadata:
        url: {{ .Values.keda.scaler.url | quote }}
        # The endpoint returns a desired instance count; targetValue "1" makes
        # desiredReplicas track it 1:1, clamped to [minReplicaCount, maxReplicaCount].
        targetValue: {{ .Values.keda.scaler.targetValue | quote }}
        valueLocation: {{ .Values.keda.scaler.valueLocation | quote }}
        format: {{ .Values.keda.scaler.format | quote }}
        method: {{ .Values.keda.scaler.method | quote }}
        {{- if .Values.keda.auth.enabled }}
        authMode: {{ .Values.keda.auth.mode | quote }}
        {{- end }}
      {{- if .Values.keda.auth.enabled }}
      authenticationRef:
        name: {{ include "coolkit.fullname" . }}
      {{- end }}
{{- end }}
