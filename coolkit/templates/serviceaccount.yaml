{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "coolkit.serviceAccountName" . }}
  labels:
    {{- include "coolkit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    {{- /* Workload Identity binding would be added here — see docs/IMPROVEMENTS.md. */}}
  {{- end }}
{{- end }}
