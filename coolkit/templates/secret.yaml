{{- if and .Values.cloudsql.enabled .Values.cloudsql.createSecret -}}
{{- if .Values.cloudsql.existingSecret -}}
{{- fail "cloudsql.createSecret and cloudsql.existingSecret are mutually exclusive — set only one" -}}
{{- end -}}
{{- /*
  DEV-ONLY convenience Secret. The recommended path is cloudsql.existingSecret pointing at a
  Secret created out-of-band (External Secrets Operator / Secret Manager CSI) so credentials
  never touch git or values.yaml. Never enable createSecret with real prod credentials in a
  committed values file.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "coolkit.dbSecretName" . }}
  labels:
    {{- include "coolkit.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ required "cloudsql.username is required when createSecret=true" .Values.cloudsql.username | quote }}
  DB_PASSWORD: {{ required "cloudsql.password is required when createSecret=true" .Values.cloudsql.password | quote }}
{{- end }}
