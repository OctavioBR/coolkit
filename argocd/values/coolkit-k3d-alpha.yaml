image:
  repository: ghcr.io/octaviobr/coolkit
  tag: efe6286

keda:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  scaler:
    url: http://coolkit.production.svc.cluster.local:8080/estimate/coolkit

metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: prometheus

additionalManifests:
- apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: coolkit-traefik
  spec:
    ingressClassName: traefik
    rules:
    - host: coolkit.localhost
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: '{{ include "coolkit.fullname" $ }}'
              port:
                name: http
