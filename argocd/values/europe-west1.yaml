# Per-region overlay for the europe-west1 cluster (rest wave — syncs after canary bakes).
# Layered on top of coolkit/values.yaml by the ArgoCD ApplicationSet.

image:
  # Promoted to the same SHA as canary once canary is verified healthy.
  tag: "0000000000000000000000000000000000000000"

ports:
  cache: 7000

cloudsql:
  # This region's own Cloud SQL instance + credentials Secret.
  host: "10.30.0.5"
  existingSecret: coolkit-db

metrics:
  serviceMonitor:
    additionalLabels:
      release: kube-prometheus-stack
